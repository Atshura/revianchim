<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revianchim - Ebook Komik Eksklusif</title>
    
    <!-- Mengimpor Font Modern Minimalis dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE TEMA */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Gradasi biru muda yang elegan */
            background: linear-gradient(135deg, #E0F7FA 0%, #C5CAE9 100%);
            color: #0A192F; /* Biru sangat gelap untuk teks, lebih elegan dari hitam */
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* AREA BUKU KOMIK - SUDUT TAJAM & BAYANGAN KONTRAST */
        .book-container {
            margin-bottom: 40px;
            /* Sudut tajam, garis tegas, dan bayangan blok (solid shadow) */
            border: 3px solid #0A192F;
            box-shadow: 12px 12px 0px rgba(10, 25, 47, 0.9);
            background-color: #fff;
            transition: transform 0.3s ease;
        }
        
        .book-container:hover {
            transform: translate(-2px, -2px);
            box-shadow: 14px 14px 0px rgba(10, 25, 47, 0.9);
        }

        /* HALAMAN KOMIK */
        .page {
            background-color: #FFFFFF;
            border-right: 1px solid #E0E0E0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            user-select: none;
            overflow: hidden;
        }

        /* AREA NAVIGASI TOMBOL */
        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 420px;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        /* STYLING TOMBOL MODERN (SUDUT 90 DERAJAT) */
        button {
            border-radius: 0; /* Menghilangkan lengkungan (sudut-sudut tajam) */
            border: 2px solid #0A192F;
            padding: 16px 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px rgba(10, 25, 47, 1);
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(10, 25, 47, 1);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px rgba(10, 25, 47, 1);
        }

        /* WARNA TOMBOL - TEORI WARNA BERSEBELAHAN & KONTRAST */
        #btn-prev {
            background-color: #4DD0E1; /* Analogous 1: Cyan/Teal */
            color: #0A192F;
            flex: 1;
        }

        #btn-next {
            background-color: #9FA8DA; /* Analogous 2: Periwinkle */
            color: #0A192F;
            flex: 1;
        }

        #btn-buka {
            background-color: #FF6D00; /* Complementary Contrast: Jingga Elegan */
            color: #FFFFFF;
            width: 100%;
        }

    </style>
</head>
<body>

    <!-- Area Flipbook -->
    <div class="book-container" id="flipbook">
        <div class="page">Sampul Depan</div>
        <div class="page">Halaman 1</div>
        <div class="page">Halaman 2</div>
        <div class="page">Halaman 3</div>
        <div class="page">Halaman 4</div>
        <div class="page">Sampul Belakang</div>
    </div>

    <!-- Area Navigasi 3 Tombol -->
    <div class="nav-container">
        <div class="nav-top">
            <button id="btn-prev">⬅ Prev</button>
            <button id="btn-next">Next ➡</button>
        </div>
        <button id="btn-buka">📖 Buka Halaman</button>
    </div>

    <!-- Script Library StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Konfigurasi Flipbook
            const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
                width: 380, // Dibuat sedikit lebih lebar agar proporsional
                height: 550,
                showCover: true,
                usePortrait: true,
                maxShadowOpacity: 0.3 // Bayangan lipatan buku yang elegan
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            document.getElementById('btn-prev').addEventListener('click', () => {
                pageFlip.flipPrev();
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                pageFlip.flipNext();
            });
            
            document.getElementById('btn-buka').addEventListener('click', () => {
                let hal = prompt("Masukkan nomor halaman yang dituju (0 untuk sampul awal):");
                if(hal !== null && hal !== "") {
                    pageFlip.flip(parseInt(hal)); 
                }
            });
        });
    </script>
</body>
</html>
