<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Komik - Revianchim</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #E0F7FA; /* Biru Muda Pastel (Latar Belakang) */
            color: #1A237E; /* Biru Dongker untuk teks */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            justify-content: center;
        }
        
        /* Kontainer untuk Komik */
        .book-container {
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        
        /* Styling Halaman Komik (Sementara berupa warna, nanti bisa diganti gambar) */
        .page {
            background-color: white;
            border: solid 1px #b3e5fc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            /* Ini mencegah teks terseleksi saat membalik halaman */
            user-select: none; 
        }
        
        /* Styling untuk Navigasi Bawah (3 Tombol) */
        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px; /* Lebar maksimal navigasi menyesuaikan buku */
        }
        .nav-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        
        /* Warna Analogous Kiri (Cyan/Teal Muda) untuk tombol Next/Prev */
        #btn-prev, #btn-next {
            background-color: #80DEEA; 
            color: #1A237E;
            flex: 1; /* Agar membagi 2 ruang sama besar */
        }
        
        /* Warna Analogous Kanan (Periwinkle Muda) untuk Buka Halaman */
        #btn-buka {
            background-color: #C5CAE9;
            color: #1A237E;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Area Flipbook -->
    <div class="book-container" id="flipbook">
        <div class="page">Sampul Depan</div>
        <div class="page">Halaman 1</div>
        <div class="page">Halaman 2</div>
        <div class="page">Halaman 3</div>
        <div class="page">Halaman 4</div>
        <div class="page">Sampul Belakang</div>
    </div>

    <!-- Area Navigasi (Sesuai Permintaan) -->
    <div class="nav-container">
        <div class="nav-top">
            <button id="btn-prev">⬅️ Previous</button>
            <button id="btn-next">Next ➡️</button>
        </div>
        <button id="btn-buka">📖 Buka Halaman</button>
    </div>

    <!-- Memuat Library StPageFlip dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inisialisasi Flipbook
            const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
                width: 350, // Lebar halaman (Portrait)
                height: 500, // Tinggi halaman
                showCover: true, // Halaman pertama dan terakhir jadi sampul
                usePortrait: true // Optimal untuk mobile
            });

            // Muat semua elemen berkelas 'page' ke dalam buku
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // Logika Tombol Previous
            document.getElementById('btn-prev').addEventListener('click', () => {
                pageFlip.flipPrev();
            });

            // Logika Tombol Next
            document.getElementById('btn-next').addEventListener('click', () => {
                pageFlip.flipNext();
            });
            
            // Logika Tombol Buka Halaman
            document.getElementById('btn-buka').addEventListener('click', () => {
                // Fitur sederhana untuk melompat ke halaman tertentu
                let hal = prompt("Masukkan nomor halaman (0 untuk sampul):");
                if(hal !== null && hal !== "") {
                    // Memastikan yang dimasukkan adalah angka
                    pageFlip.flip(parseInt(hal)); 
                }
            });
        });
    </script>
</body>
</html>
