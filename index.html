<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atshura Comics - Premium Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F8FAFC;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.5);
            --accent: #4F46E5;
            --shadow-glass: 0 4px 30px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #0B0F19;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --glass-bg: rgba(15, 23, 42, 0.9);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #6366F1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease;
            /* Menggunakan dvh agar sesuai dengan tinggi layar HP saat URL bar muncul/hilang */
            height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* === TAMPILAN IMMERSIVE (UI HILANG) === */
        body.ui-hidden header { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        body.ui-hidden .bottom-nav { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
        body.ui-hidden .progress-container { opacity: 0; }
        body.ui-hidden .reader-area { padding: 0; }
        body.ui-hidden .book-container { border-radius: 0; max-width: 100vw; }

        /* HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; box-shadow: var(--shadow-glass);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px;}
        .brand-badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 1px;}
        
        .header-tools { display: flex; gap: 8px; }
        .icon-btn {
            background: transparent; border: 1px solid var(--glass-border); color: var(--text-main);
            width: 34px; height: 34px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .progress-container { position: fixed; top: 59px; left: 0; width: 100%; height: 2px; background: transparent; z-index: 99; transition: opacity 0.3s; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

        /* AREA BACA */
        .reader-area {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
            padding: 70px 0 80px 0; width: 100%; height: 100dvh;
            transition: all 0.3s ease;
        }
        
        .book-container {
            width: 100%; height: 100%; max-width: 600px;
            background-color: var(--bg-color); transition: all 0.3s ease;
        }

        .page { background-color: #FFF; display: flex; justify-content: center; align-items: center; user-select: none; font-weight: bold; font-size: 20px; color: #ccc;}
        .page img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        /* BOTTOM NAV - DIPERBAIKI AGAR TIDAK BERTUMPUK */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 50px;
            display: flex; align-items: center; justify-content: space-between; padding: 6px 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 100;
            width: 90%; max-width: 320px; /* Lebar dibatasi agar rapi di HP */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn {
            background: transparent; color: var(--text-main); border: none;
            width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .nav-btn.primary { background: var(--accent); color: white; width: auto; padding: 0 16px; border-radius: 20px; font-weight: 600; font-size: 13px; gap: 6px;}
        .nav-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
        
        /* FIX BUG: Teks tidak akan wrap/turun ke bawah lagi */
        .page-info { 
            font-size: 13px; font-weight: 600; color: var(--text-main); 
            white-space: nowrap; /* Mencegah teks bertumpuk ke bawah */
            text-align: center; font-variant-numeric: tabular-nums;
        }

        /* MODAL DLL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-color); color: var(--text-main); width: 100%; max-width: 500px; padding: 24px; border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .grid-halaman { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 40vh; overflow-y: auto; margin-top: 15px;}
        .btn-angka { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); padding: 10px 0; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px;}
        .btn-angka.active { background: var(--accent); color: white; border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="brand">Atshura <span class="brand-badge">PRO</span></div>
        <div class="header-tools">
            <!-- Tombol Mode Manga (Kanan ke Kiri) -->
            <button class="icon-btn" id="btn-rtl" title="Mode Manga (Kanan ke Kiri)">
                <svg viewBox="0 0 24 24"><path d="M21 12H3m0 0l6-6m-6 6l6 6"></path></svg>
            </button>
            <button class="icon-btn" id="btn-darkmode" title="Ubah Tema">
                <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
            <button class="icon-btn" id="btn-fullscreen-header" title="Layar Penuh API">
                <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            </button>
        </div>
    </header>

    <div class="progress-container"><div class="progress-bar" id="reading-progress"></div></div>

    <!-- Area ini murni untuk deteksi sentuhan Immersive -->
    <div class="reader-area" id="reader-area">
        <div class="book-container" id="flipbook">
            <div class="page">Sampul Depan</div>
            <div class="page">Hal 1</div>
            <div class="page">Hal 2</div>
            <div class="page">Hal 3</div>
            <div class="page">Hal 4</div>
            <div class="page">Sampul Belakang</div>
        </div>
    </div>

    <!-- Desain Bottom Nav yang Lebih Padat untuk HP -->
    <div class="bottom-nav">
        <button class="nav-btn" id="btn-prev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
        <div class="page-info" id="info-halaman">0 / 5</div>
        <button class="nav-btn primary" id="btn-buka">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Bab
        </button>
        <button class="nav-btn" id="btn-next"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    </div>

    <div class="modal-overlay" id="modal-halaman">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size: 16px;">Daftar Halaman</h3>
                <button class="icon-btn" id="btn-tutup-modal" style="border:none; background:transparent;">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="grid-halaman" id="grid-angka"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pages = document.querySelectorAll('.page');
            const totalHalaman = pages.length - 1;
            const infoHalaman = document.getElementById('info-halaman');
            const progressBar = document.getElementById('reading-progress');
            let isMangaMode = false; // Mode Manga Off by default

            // SETUP FLIPBOOK
            const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
                width: 400, height: 600, size: "stretch", 
                minWidth: 250, maxWidth: 1000, minHeight: 400, maxHeight: 1500,
                showCover: true, usePortrait: true, mobileScrollSupport: false 
            });
            pageFlip.loadFromHTML(pages);

            // LOGIKA UPDATE HALAMAN & HAPTIC FEEDBACK
            pageFlip.on('flip', (e) => {
                infoHalaman.innerText = `${e.data} / ${totalHalaman}`;
                progressBar.style.width = ((e.data / totalHalaman) * 100) + '%';
                
                // Haptic Feedback (Getar HP) jika didukung browser
                if (navigator.vibrate) navigator.vibrate(30);

                // Auto-Hide UI saat membaca untuk fokus
                document.body.classList.add('ui-hidden');

                // Update Modal
                document.querySelectorAll('.btn-angka').forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.getElementById(`btn-hal-${e.data}`);
                if(activeBtn) activeBtn.classList.add('active');
            });

            // LOGIKA KETUK LAYAR CERDAS
            document.getElementById('reader-area').addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('.bottom-nav')) return;

                const screenWidth = window.innerWidth;
                const clickX = e.clientX;

                if (clickX < screenWidth * 0.3) {
                    // Ketuk Kiri (Jika mode manga, kiri artinya Next)
                    isMangaMode ? pageFlip.flipNext() : pageFlip.flipPrev();
                } 
                else if (clickX > screenWidth * 0.7) {
                    // Ketuk Kanan (Jika mode manga, kanan artinya Prev)
                    isMangaMode ? pageFlip.flipPrev() : pageFlip.flipNext();
                } 
                else {
                    // Ketuk Tengah -> Munculkan/Sembunyikan UI
                    document.body.classList.toggle('ui-hidden');
                }
            });

            // TRUE FULLSCREEN API (Memaksa Browser Hilang URL Bar-nya)
            document.getElementById('btn-fullscreen-header').addEventListener('click', () => {
                const elem = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (elem.requestFullscreen) { elem.requestFullscreen(); }
                    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } // Safari/Chrome Mobile
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); }
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                }
                document.body.classList.add('ui-hidden');
            });

            // TOMBOL NAVIGASI BAWAH 
            document.getElementById('btn-prev').addEventListener('click', () => isMangaMode ? pageFlip.flipNext() : pageFlip.flipPrev());
            document.getElementById('btn-next').addEventListener('click', () => isMangaMode ? pageFlip.flipPrev() : pageFlip.flipNext());

            // MODE MANGA TOGGLE
            const btnRtl = document.getElementById('btn-rtl');
            btnRtl.addEventListener('click', () => {
                isMangaMode = !isMangaMode;
                btnRtl.classList.toggle('active');
                // Beri notifikasi getar panjang
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]); 
            });

            // MODAL GENERATOR
            const modal = document.getElementById('modal-halaman');
            const gridAngka = document.getElementById('grid-angka');
            for (let i = 0; i <= totalHalaman; i++) {
                let btn = document.createElement('button');
                btn.classList.add('btn-angka');
                btn.id = `btn-hal-${i}`;
                btn.innerText = i;
                
                btn.addEventListener('click', () => { pageFlip.flip(i); modal.classList.remove('active'); });
                gridAngka.appendChild(btn);
            }
            
            document.getElementById('btn-buka').addEventListener('click', () => modal.classList.add('active'));
            document.getElementById('btn-tutup-modal').addEventListener('click', () => modal.classList.remove('active'));

            // DARK MODE TERSIMPAN
            const btnDark = document.getElementById('btn-darkmode');
            if(localStorage.getItem('atshura_theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

            btnDark.addEventListener('click', () => {
                if(document.body.getAttribute('data-theme') === 'dark') {
                    document.body.removeAttribute('data-theme');
                    localStorage.setItem('atshura_theme', 'light');
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                    localStorage.setItem('atshura_theme', 'dark');
                }
            });
        });
    </script>
</body>
</html>
