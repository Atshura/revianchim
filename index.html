<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revianchim - Ebook Komik</title>
    
    <!-- Mengimpor Font 'Poppins' yang Luwes dan Elegan -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & TEMA DASAR */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Gradasi biru muda (Analogous) yang lembut */
            background: linear-gradient(135deg, #E0F7FA 0%, #C5CAE9 100%);
            color: #1A237E;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* AREA BUKU KOMIK - ELEGAN DENGAN BAYANGAN HALUS */
        .book-container {
            margin-bottom: 30px;
            /* Sudut melengkung dan bayangan yang sangat lembut */
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(26, 35, 126, 0.15);
            background-color: #fff;
            overflow: hidden; 
        }

        /* HALAMAN KOMIK */
        .page {
            background-color: #FFFFFF;
            border-right: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            color: #555;
            user-select: none;
        }

        /* AREA NAVIGASI TOMBOL */
        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 380px;
        }

        .nav-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        /* STYLING TOMBOL MELENGKUNG (PILL-SHAPE) */
        button {
            border-radius: 30px; /* Sudut melengkung sempurna */
            border: none;
            padding: 14px 24px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        button:hover {
            transform: translateY(-3px); /* Efek melayang saat disentuh */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        button:active {
            transform: translateY(1px);
        }

        /* WARNA TOMBOL */
        #btn-prev { background-color: #80DEEA; color: #0A192F; flex: 1; }
        #btn-next { background-color: #9FA8DA; color: #0A192F; flex: 1; }
        #btn-buka { 
            background-color: #FF8A65; /* Oranye/Coral lembut (Complementary) */
            color: #FFFFFF; 
            width: 100%; 
        }

        /* ====== DESAIN MENU POP-UP (MODAL) ====== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 25, 47, 0.4);
            backdrop-filter: blur(5px); /* Efek blur di latar belakang */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #1A237E;
            font-weight: 600;
        }

        .grid-halaman {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-angka {
            background-color: #F0F4F8;
            color: #1A237E;
            padding: 10px 0;
            border-radius: 12px; /* Melengkung halus */
            font-size: 14px;
            box-shadow: none;
        }

        .btn-angka:hover {
            background-color: #C5CAE9;
            color: #1A237E;
        }

        #btn-tutup-modal {
            background-color: #E0E0E0;
            color: #333;
            padding: 10px 30px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- Area Flipbook -->
    <div class="book-container" id="flipbook">
        <!-- Sengaja dibuat 21 Halaman (0 sampai 20) agar sesuai dengan menu -->
        <div class="page">Sampul (0)</div>
        <div class="page">Halaman 1</div>
        <div class="page">Halaman 2</div>
        <div class="page">Halaman 3</div>
        <div class="page">Halaman 4</div>
        <div class="page">Halaman 5</div>
        <div class="page">Halaman 6</div>
        <div class="page">Halaman 7</div>
        <div class="page">Halaman 8</div>
        <div class="page">Halaman 9</div>
        <div class="page">Halaman 10</div>
        <div class="page">Halaman 11</div>
        <div class="page">Halaman 12</div>
        <div class="page">Halaman 13</div>
        <div class="page">Halaman 14</div>
        <div class="page">Halaman 15</div>
        <div class="page">Halaman 16</div>
        <div class="page">Halaman 17</div>
        <div class="page">Halaman 18</div>
        <div class="page">Halaman 19</div>
        <div class="page">Sampul Belakang (20)</div>
    </div>

    <!-- Area Navigasi Utama -->
    <div class="nav-container">
        <div class="nav-top">
            <button id="btn-prev">⬅ Prev</button>
            <button id="btn-next">Next ➡</button>
        </div>
        <button id="btn-buka">📖 Buka Halaman</button>
    </div>

    <!-- Menu Pop-up (Modal) untuk Memilih Halaman -->
    <div class="modal-overlay" id="modal-halaman">
        <div class="modal-content">
            <h3>Pilih Halaman</h3>
            <div class="grid-halaman" id="grid-angka">
                <!-- Angka 0-20 akan dimunculkan oleh JavaScript di sini -->
            </div>
            <button id="btn-tutup-modal">Tutup</button>
        </div>
    </div>

    <!-- Script Library StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Konfigurasi Flipbook
            const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
                width: 380,
                height: 550,
                showCover: true,
                usePortrait: true,
                maxShadowOpacity: 0.2 // Dibuat lebih tipis agar elegan
            });

            // Muat semua elemen HTML sebagai halaman
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // 2. Tombol Navigasi Kiri Kanan
            document.getElementById('btn-prev').addEventListener('click', () => {
                pageFlip.flipPrev();
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                pageFlip.flipNext();
            });
            
            // 3. Logika Menu Modal (Buka Halaman)
            const modal = document.getElementById('modal-halaman');
            const btnBuka = document.getElementById('btn-buka');
            const btnTutup = document.getElementById('btn-tutup-modal');
            const gridAngka = document.getElementById('grid-angka');

            // Fungsi Membuat Tombol Angka 0 sampai 20
            for (let i = 0; i <= 20; i++) {
                let btn = document.createElement('button');
                btn.classList.add('btn-angka');
                btn.innerText = i;
                
                // Jika tombol angka ditekan
                btn.addEventListener('click', () => {
                    pageFlip.flip(i); // Lompat ke halaman sesuai angka
                    modal.classList.remove('active'); // Tutup menu
                });
                
                gridAngka.appendChild(btn);
            }

            // Tampilkan menu saat tombol "Buka Halaman" ditekan
            btnBuka.addEventListener('click', () => {
                modal.classList.add('active');
            });

            // Tutup menu saat tombol "Tutup" ditekan
            btnTutup.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            // Tutup menu jika pengguna mengklik di luar area putih (di area gelap)
            modal.addEventListener('click', (e) => {
                if(e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
